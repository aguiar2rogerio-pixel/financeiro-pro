<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Financeiro Pro - Restaurador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #111111; color: #ffffff; font-family: sans-serif; }
        .input-autonomo { background-color: #1f2937; border: 2px solid #4b5563; color: #ffffff; padding: 0.75rem; border-radius: 1rem; width: 100%; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #1f2937; padding: 1.5rem; border-radius: 1.5rem; width: 90%; max-width: 400px; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <header class="text-center my-8">
        <h1 class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Total Acumulado</h1>
        <div id="saldo-total" class="text-5xl font-black text-green-500">R$ 0,00</div>
        
        <div class="grid grid-cols-2 gap-4 mt-6">
            <div class="bg-gray-900 p-3 rounded-2xl border border-gray-800">
                <span class="block text-[10px] text-emerald-400 font-bold uppercase mb-1">Guardado</span>
                <span id="saldo-guardado-investimento" class="text-lg font-black text-emerald-400">R$ 0,00</span>
            </div>
            <div class="bg-gray-900 p-3 rounded-2xl border border-gray-800">
                <span class="block text-[10px] text-blue-400 font-bold uppercase mb-1">Disponível</span>
                <span id="saldo-disponivel" class="text-lg font-black text-blue-400">R$ 0,00</span>
            </div>
        </div>
    </header>

    <main class="space-y-6">
        <div class="bg-gray-900 p-4 rounded-3xl border-2 border-gray-800">
            <h2 class="text-xs font-bold text-gray-500 uppercase mb-4 tracking-tighter">Lançamento do Dia</h2>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <input id="faturamento" type="number" placeholder="Ganho" class="input-autonomo">
                <input id="gasolina" type="number" placeholder="Combustível" class="input-autonomo">
                <input id="pessoal" type="number" placeholder="Gastos" class="input-autonomo">
                <input id="guardado-valor" type="number" placeholder="Guardar" class="input-autonomo">
            </div>
            <button onclick="salvarLancamento()" class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-sm">Salvar Lançamento</button>
        </div>

        <div class="flex gap-2">
            <button onclick="abrirFecharMes()" class="flex-1 bg-yellow-600 text-black py-3 rounded-xl font-bold text-xs uppercase">Fechar Mês</button>
            <label class="flex-1 bg-gray-800 text-white py-3 rounded-xl font-bold text-xs uppercase text-center cursor-pointer">
                📥 Ler Backup
                <input type="file" class="hidden" onchange="importarBackup(event)">
            </label>
        </div>

        <div class="mt-8">
            <h3 class="text-xs font-bold text-gray-500 uppercase mb-3">Histórico Recente</h3>
            <div id="historico-body" class="space-y-2"></div>
        </div>
        
        <div class="mt-8">
            <h3 class="text-xs font-bold text-gray-500 uppercase mb-3">Meses Arquivados</h3>
            <div id="meses-anteriores-container" class="space-y-2"></div>
        </div>
    </main>

    <!-- Modal Fechamento -->
    <div id="modal-fechar-mes" class="modal-overlay">
        <div class="modal-content">
            <h2 class="text-white font-bold mb-4">Fechar Mês</h2>
            <input id="input-nome-mes-fechamento" type="text" class="input-autonomo mb-4" placeholder="Ex: JULHO DE 2026">
            <div class="flex gap-2">
                <button onclick="confirmarFecharMes()" class="flex-1 bg-green-600 py-3 rounded-xl font-bold">Confirmar</button>
                <button onclick="document.getElementById('modal-fechar-mes').classList.remove('active')" class="flex-1 bg-gray-700 py-3 rounded-xl font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let dados = JSON.parse(localStorage.getItem('financeiro_pro')) || { 
            saldoTransportado: 0, 
            historico: [], 
            mesesAnteriores: [], 
            sugestoesGastos: [] 
        };

        function formatarMoeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

        function atualizarUI() {
            let entries = parseFloat(dados.saldoTransportado || 0);
            let exits = 0;
            let saved = 0;

            dados.historico.forEach(item => {
                entries += (parseFloat(item.faturamento) || 0) + (parseFloat(item.rendaExtra) || 0);
                exits += (parseFloat(item.gasolina) || 0) + (parseFloat(item.pessoal) || 0);
                saved += (parseFloat(item.guardado) || 0) - (parseFloat(item.guardadoResgate) || 0);
            });

            const total = entries - exits;
            const avail = total - saved;

            document.getElementById('saldo-total').innerText = formatarMoeda(total);
            document.getElementById('saldo-guardado-investimento').innerText = formatarMoeda(saved);
            document.getElementById('saldo-disponivel').innerText = formatarMoeda(avail);

            const hBody = document.getElementById('historico-body');
            hBody.innerHTML = dados.historico.length ? '' : '<p class="text-gray-600 text-xs italic">Vazio</p>';
            [...dados.historico].reverse().forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "bg-gray-900 p-3 rounded-xl border border-gray-800 flex justify-between items-center";
                div.innerHTML = `<div><span class="text-xs font-bold">${item.data}</span></div><div class="text-xs font-black ${item.saldoDia >=0 ? 'text-green-500':'text-red-500'}">${formatarMoeda(item.saldoDia)}</div>`;
                hBody.appendChild(div);
            });

            const mBody = document.getElementById('meses-anteriores-container');
            mBody.innerHTML = dados.mesesAnteriores.map((m, i) => `
                <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 flex justify-between items-center">
                    <span class="text-[10px] font-bold text-gray-400">${m.periodo}</span>
                    <span class="text-xs font-bold text-blue-400">${formatarMoeda(m.saldoFinalNoMes || 0)}</span>
                </div>
            `).join('');
        }

        function salvarLancamento() {
            const f = parseFloat(document.getElementById('faturamento').value) || 0;
            const g = parseFloat(document.getElementById('gasolina').value) || 0;
            const p = parseFloat(document.getElementById('pessoal').value) || 0;
            const gua = parseFloat(document.getElementById('guardado-valor').value) || 0;

            dados.historico.push({
                data: new Date().toLocaleDateString('pt-BR').substring(0,5),
                faturamento: f, gasolina: g, pessoal: p, guardado: gua,
                saldoDia: f - g - p,
                timestamp: Date.now()
            });

            localStorage.setItem('financeiro_pro', JSON.stringify(dados));
            ['faturamento','gasolina','pessoal','guardado-valor'].forEach(id => document.getElementById(id).value = '');
            atualizarUI();
        }

        function abrirFecharMes() { document.getElementById('modal-fechar-mes').classList.add('active'); }

        function confirmarFecharMes() {
            const label = document.getElementById('input-nome-mes-fechamento').value.trim().toUpperCase();
            if(!label) return alert('Nomeie o período');

            let fat = 0, renda = 0, gas = 0, pes = 0, gua = 0;
            dados.historico.forEach(item => {
                fat += (parseFloat(item.faturamento) || 0);
                renda += (parseFloat(item.rendaExtra) || 0);
                gas += (parseFloat(item.gasolina) || 0);
                pes += (parseFloat(item.pessoal) || 0);
                gua += (parseFloat(item.guardado) || 0) - (parseFloat(item.guardadoResgate) || 0);
            });

            const final = (parseFloat(dados.saldoTransportado || 0) + fat + renda) - gas - pes;
            dados.mesesAnteriores.push({ periodo: label, saldoFinalNoMes: final, historico: [...dados.historico] });
            dados.saldoTransportado = final;
            dados.historico = [];
            localStorage.setItem('financeiro_pro', JSON.stringify(dados));
            document.getElementById('modal-fechar-mes').classList.remove('active');
            atualizarUI();
            alert('Mês fechado!');
        }

        function importarBackup(e) {
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const b = JSON.parse(reader.result);
                    if(b) {
                        // Forçar compatibilidade: se não tiver saldoTransportado, ele assume o que estiver no backup ou 0
                        dados = {
                            saldoTransportado: b.saldoTransportado || 0,
                            historico: b.historico || [],
                            mesesAnteriores: b.mesesAnteriores || [],
                            sugestoesGastos: b.sugestoesGastos || []
                        };
                        localStorage.setItem('financeiro_pro', JSON.stringify(dados));
                        atualizarUI();
                        alert('Backup restaurado!');
                    }
                } catch(err) { alert('Erro no arquivo'); }
            };
            if(e.target.files.length > 0) reader.readAsText(e.target.files[0]);
        }

        atualizarUI();
    </script>
</body>
</html>
