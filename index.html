<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerenciador Financeiro</title>
    <link rel="manifest" href="manifest.json">
    <theme-color content="#0f172a">
    <style>
        :root {
            --bg-principal: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
            --verde-ganho: #10b981;
            --verde-fundo: rgba(16, 185, 129, 0.08);
            --vermelho-gasto: #ef4444;
            --vermelho-fundo: rgba(239, 68, 68, 0.08);
            --azul-acao: #3b82f6;
            --amarelo-alerta: #f59e0b;
            --raio-borda: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto-principal); padding: 12px; padding-bottom: 30px; }

        .container { max-width: 480px; margin: 0 auto; }

        /* CABEÇALHO / CARDS */
        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--raio-borda);
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
        }
        .header-card .label { font-size: 0.8rem; color: var(--texto-secundario); text-transform: uppercase; letter-spacing: 0.5px; }
        .header-card .valor { font-size: 1.8rem; font-weight: bold; margin-top: 4px; color: var(--verde-ganho); }

        .top-cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .mini-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--raio-borda);
            padding: 12px;
            text-align: center;
        }
        .mini-card .label { font-size: 0.75rem; color: var(--texto-secundario); }
        .mini-card .valor { font-size: 1.1rem; font-weight: bold; margin-top: 2px; }

        /* FORMULÁRIO DE LANÇAMENTO */
        .form-secao {
            border-radius: var(--raio-borda);
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--card-border);
        }
        .secao-entradas { background: var(--verde-fundo); border-color: rgba(16, 185, 129, 0.2); }
        .secao-saidas { background: var(--vermelho-fundo); border-color: rgba(239, 68, 68, 0.2); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
        .form-group.full-width { grid-column: span 2; }
        
        label { font-size: 0.75rem; color: var(--texto-secundario); font-weight: 600; }
        input, select {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
        }

        /* TOGGLE GUARDAR/RESGATAR */
        .toggle-container {
            display: flex;
            background: #0f172a;
            border-radius: 6px;
            padding: 2px;
            border: 1px solid var(--card-border);
            margin-bottom: 4px;
        }
        .toggle-btn {
            flex: 1;
            padding: 4px;
            font-size: 0.65rem;
            border: none;
            background: transparent;
            color: var(--texto-secundario);
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .toggle-btn.active-guardar { background: var(--verde-ganho); color: #fff; }
        .toggle-btn.active-resgatar { background: var(--azul-acao); color: #fff; }

        /* BOTÕES DE AÇÃO */
        .btn-principal {
            width: 100%;
            background: var(--azul-acao);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: var(--raio-borda);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-secundario {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--texto-principal);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
        }

        /* BALANÇO & DADOS */
        .balanco-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
        .card-balanco {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* MODAIS / SUBJANELAS */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--raio-borda);
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 16px;
        }

        .top-bar-config { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .btn-config { background: none; border: none; color: var(--texto-secundario); font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- ÍCONE DE CONFIGURAÇÕES / BACKUP -->
    <div class="top-bar-config">
        <button class="btn-config" onclick="abrirModal('modal-config')" title="Configurações e Backup">⚙️</button>
    </div>

    <!-- CARDS DO TOPO -->
    <div class="header-card">
        <div class="label">Total Acumulado</div>
        <div class="valor" id="txt-total-acumulado">R$ 0,00</div>
    </div>

    <div class="top-cards-grid">
        <div class="mini-card">
            <div class="label">Reservar Dinheiro</div>
            <div class="valor" id="txt-reservar-dinheiro" style="color: var(--azul-acao);">R$ 0,00</div>
        </div>
        <div class="mini-card">
            <div class="label">Disponível</div>
            <div class="valor" id="txt-disponivel" style="color: var(--verde-ganho);">R$ 0,00</div>
        </div>
    </div>

    <!-- FORMULÁRIO DE LANÇAMENTO DIÁRIO -->
    <form id="form-lancamento" onsubmit="salvarLancamento(event)">
        <!-- BLOCOS DE ENTRADAS -->
        <div class="form-secao secao-entradas">
            <div class="form-grid">
                <div class="form-group">
                    <label>Faturamento (+)</label>
                    <input type="number" step="0.01" id="input-faturamento" placeholder="0,00">
                </div>
                <div class="form-group">
                    <label>Renda Extra (+)</label>
                    <input type="number" step="0.01" id="input-renda-extra" placeholder="0,00">
                </div>
            </div>
        </div>

        <!-- BLOCOS DE SAÍDAS E RESERVA -->
        <div class="form-secao secao-saidas">
            <div class="form-grid">
                <div class="form-group">
                    <label>Combustível (-)</label>
                    <input type="number" step="0.01" id="input-combustivel" placeholder="0,00">
                </div>
                <div class="form-group">
                    <div class="toggle-container">
                        <button type="button" id="btn-modo-guardar" class="toggle-btn active-guardar" onclick="setModoReserva('guardar')">+ Guardar</button>
                        <button type="button" id="btn-modo-resgatar" class="toggle-btn" onclick="setModoReserva('resgatar')">- Resgatar</button>
                    </div>
                    <input type="number" step="0.01" id="input-reserva-valor" placeholder="0,00">
                </div>
                
                <div class="form-group full-width">
                    <label>Despesas (-)</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="number" id="input-despesas-total" placeholder="0,00" readonly style="background: #1e293b;">
                        <button type="button" class="btn-secundario" style="width: auto; white-space: nowrap;" onclick="abrirModal('modal-planilha-despesas')">📝 Registrar Despesas</button>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-principal">💾 Salvar Lançamento do Dia</button>
    </form>

    <!-- BALANÇO MENSAL -->
    <div style="margin-top: 24px;">
        <h3>Balanço do Período</h3>
        <div class="balanco-grid" id="grid-balanco-cards">
            <!-- Cards dinamicos via Javascript -->
        </div>
        <button class="btn-secundario" style="margin-top: 12px; background: var(--amarelo-alerta); color: #000; font-weight: bold;" onclick="solicitarFecharBalanco()">📅 Fechar Balanço Mensal</button>
    </div>
</div>

<!-- SUBJANELA: PLANILHA DE DESPESAS -->
<div class="modal" id="modal-planilha-despesas">
    <div class="modal-content">
        <h3>Planilha de Despesas</h3>
        <p style="font-size: 0.8rem; color: var(--texto-secundario); margin-bottom: 12px;">Adicione seus gastos do dia por categoria:</p>
        
        <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="despesa-desc" placeholder="Ex: Mercado, Almoço, Troca de óleo">
        </div>
        <div class="form-group">
            <label>Categoria</label>
            <select id="despesa-categoria">
                <option value="Manutenção">🛠️ Manutenção</option>
                <option value="Alimentação">🍽️ Refeição / Alimentação</option>
                <option value="Contas">🏠 Contas de Consumo</option>
                <option value="Mercado">🛒 Mercado</option>
                <option value="Pessoal">👤 Pessoal / Lazer</option>
                <option value="Outros">📦 Outros</option>
            </select>
        </div>
        <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="despesa-valor" placeholder="0,00">
        </div>

        <button class="btn-secundario" onclick="adicionarItemDespesa()" style="margin-bottom: 12px;">+ Adicionar Item</button>

        <div id="lista-itens-despesa" style="max-height: 150px; overflow-y: auto; margin-bottom: 12px;">
            <!-- Itens adicionados aparecem aqui -->
        </div>

        <div style="display: flex; gap: 8px;">
            <button class="btn-principal" onclick="confirmarDespesas()">💾 Confirmar e Enviar</button>
            <button class="btn-secundario" onclick="fecharModal('modal-planilha-despesas')">Cancelar</button>
        </div>
    </div>
</div>

<!-- SUBJANELA: CONFIGURAÇÕES E BACKUP -->
<div class="modal" id="modal-config">
    <div class="modal-content">
        <h3>Configurações e Dados</h3>
        <p style="font-size: 0.8rem; color: var(--texto-secundario); margin-bottom: 16px;">Gerencie suas cópias de segurança:</p>
        
        <button class="btn-secundario" style="margin-bottom: 8px;" onclick="exportarBackup()">📦 Salvar Backup Manual</button>
        <button class="btn-secundario" style="margin-bottom: 16px;" onclick="document.getElementById('input-file-backup').click()">📥 Ler Backup</button>
        <input type="file" id="input-file-backup" style="display: none;" onchange="importarBackup(event)">

        <button class="btn-principal" style="background: var(--card-border);" onclick="fecharModal('modal-config')">Fechar</button>
    </div>
</div>

<script>
    let modoReserva = 'guardar'; // 'guardar' ou 'resgatar'

    function setModoReserva(modo) {
        modoReserva = modo;
        const btnG = document.getElementById('btn-modo-guardar');
        const btnR = document.getElementById('btn-modo-resgatar');
        
        if (modo === 'guardar') {
            btnG.className = 'toggle-btn active-guardar';
            btnR.className = 'toggle-btn';
        } else {
            btnG.className = 'toggle-btn';
            btnR.className = 'toggle-btn active-resgatar';
        }
    }

    function abrirModal(id) { document.getElementById(id).classList.add('active'); }
    function fecharModal(id) { document.getElementById(id).classList.remove('active'); }

    function solicitarFecharBalanco() {
        if (confirm("Tem certeza de que deseja fechar e arquivar o período atual?")) {
            // Lógica de fechamento de balanço
        }
    }
</script>
</body>
</html>
